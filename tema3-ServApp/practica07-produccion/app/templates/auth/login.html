{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
<div class="caja-formulario">
  <h1>Iniciar sesión</h1>

  <form method="post" class="formulario">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>Email
      <input type="email" name="email" required value="{{ request.form.email }}">
    </label>
    <label>Contraseña
      <input type="password" name="password" required>
    </label>

    <button class="boton">Entrar</button>
  </form>

  <p class="texto-suave">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Regístrate</a></p>
</div>
{% endblock %}
