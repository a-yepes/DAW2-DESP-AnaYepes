server {

    listen 80; #puerto por el que escucha nginx

    server_name localhost;

    location / { #procesa todas las rutas 

        proxy_pass http://app:8000;  #reenvia las peticiones a gunicorn. No ponemos localhost:8000 porque Nginx y Gunicorn están en contenedores distintos. Nginx utiliza el nombre del servicio app para comunicarse con el contenedor de Gunicorn a través de la red interna de Docker.

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

    }

}