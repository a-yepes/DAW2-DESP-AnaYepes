events {}

http {
    include /etc/nginx/mime.types;   # tipos de archivo (css, js, png...)
    server_tokens off;                # no mostrar la versión de Nginx (seguridad)

    server {
        listen 80;
        server_name _;                # acepta cualquier nombre (localhost, el subdominio...)

        # Cabeceras de seguridad básicas
        add_header X-Frame-Options "SAMEORIGIN";       # impide meter la web en un iframe ajeno
        add_header X-Content-Type-Options "nosniff";   # el navegador respeta el tipo de archivo

        location / {
            proxy_pass http://flask:5000;              # reenvía todo al contenedor flask
            proxy_set_header Host $host;                # pasa el dominio original
            proxy_set_header X-Real-IP $remote_addr;    # pasa la IP real del visitante
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}