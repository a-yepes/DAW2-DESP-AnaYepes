server {
    listen 80;  #Nginx escucha peticiones HTTP por el puerto 80

    server_name localhost; #nombre del servidor

    location / {
        proxy_pass http://tomcat:8080; #reenviar las peticiones al contenedor de Tomcat en el puerto 8080

        proxy_set_header Host $host; 
        proxy_set_header X-Real-IP $remote_addr; #pasar la dirección IP del cliente al servidor Tomcat
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
        proxy_set_header X-Forwarded-Proto $scheme; 
    }
}